<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CounterForge PRO</title>

<style>
body { margin:0; font-family:Arial; background:#0b0b0b; color:white; }
.container { padding:16px; max-width:520px; margin:auto; }

input, select, button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  font-size:16px;
}

button { background:#4f46e5; color:white; }

.card {
  margin-top:15px;
  background:#151515;
  padding:14px;
  border-radius:12px;
}

.badge {
  display:inline-block;
  margin:5px;
  padding:6px 10px;
  background:#2a2a2a;
  border-radius:8px;
}

.small { font-size:12px; opacity:0.7; }
hr { border:0; border-top:1px solid #333; margin:10px 0; }
</style>
</head>

<body>

<div class="container">

<h2>CounterForge PRO</h2>

<input id="search" placeholder="Search champion..." oninput="filter()">

<select id="champ"></select>

<button onclick="analyze()">Analyze Draft</button>

<div id="out"></div>

</div>

<script>

let champs = [];

/* =========================
   LOAD ALL CHAMPIONS
========================= */
fetch("https://ddragon.leagueoflegends.com/cdn/14.1.1/data/en_US/champion.json")
.then(r => r.json())
.then(data => {
  champs = Object.keys(data.data).sort();

  document.getElementById("champ").innerHTML =
    champs.map(c => `<option>${c}</option>`).join("");
});


/* =========================
   SIMPLE DATA-DRIVEN ENGINE
========================= */

function scoreCounter(enemy, pick){

  const antiAssassin = ["Lissandra","Malzahar","Annie","Galio"];
  const antiTank = ["Vayne","Fiora","Trundle","Kayn"];
  const antiBruiser = ["Quinn","Gnar","Teemo","Vayne"];

  let score = 6.5;

  const isTank = ["Ornn","Sion","Malphite","Shen","Zac"].includes(enemy);
  const isAssassin = ["Zed","Talon","Katarina","Akali","Yone"].includes(enemy);
  const isBruiser = ["Jax","Darius","Irelia","Fiora","Aatrox"].includes(enemy);

  if (isAssassin && antiAssassin.includes(pick)) score += 2.0;
  if (isTank && antiTank.includes(pick)) score += 1.8;
  if (isBruiser && antiBruiser.includes(pick)) score += 1.8;

  // bonus logic
  if (enemy === "Zed" && pick === "Lissandra") score += 1.5;
  if (enemy === "Jax" && pick === "Poppy") score += 1.5;

  return Math.min(10, Number(score.toFixed(1)));
}


/* =========================
   COUNTER ENGINE
========================= */

function getCounters(enemy){

  const pool = [
    "Malphite","Poppy","Gragas","Lissandra","Annie",
    "Sett","Garen","Shen","Ornn","Teemo",
    "Vayne","Quinn","Fiora","Trundle","Gnar",
    "Galio","Kayn","Mordekaiser"
  ];

  return pool
    .map(p => ({
      name: p,
      score: scoreCounter(enemy, p)
    }))
    .sort((a,b) => b.score - a.score)
    .slice(0,5);
}


/* =========================
   ANALYZE DRAFT
========================= */

function analyze(){

  let enemy = document.getElementById("champ").value;
  let counters = getCounters(enemy);

  let ban =
    enemy === "Zed" ? "Ban Zed (high snowball assassin)" :
    enemy === "Yasuo" ? "Ban Yasuo (soloQ carry)" :
    enemy === "Irelia" ? "Ban Irelia (lane bully)" :
    "Ban high mobility assassin";

  document.getElementById("out").innerHTML = `
    <div class="card">
      <h3>VS ${enemy}</h3>
      <div class="small">Data-driven counter engine</div>

      <hr>

      <b>BEST COUNTERS</b><br>
      ${counters.map(c => `
        <div class="badge">${c.name} • ${c.score}/10</div>
      `).join("")}

      <hr>

      <b>BAN</b><br>
      <div class="badge">${ban}</div>

      <hr>

      <div class="small">
        • play for early tempo<br>
        • deny enemy engage windows<br>
        • scale safe into mid game
      </div>
    </div>
  `;
}


/* =========================
   SEARCH
========================= */

function filter(){
  let v = document.getElementById("search").value.toLowerCase();

  document.getElementById("champ").innerHTML =
    champs
      .filter(c => c.toLowerCase().includes(v))
      .map(c => `<option>${c}</option>`)
      .join("");
}

</script>

</body>
</html>

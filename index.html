<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CounterForge PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:Inter, Arial;
  background: radial-gradient(circle at top, #1a1a2e, #0a0a0a);
  color:white;
}

.container { padding:20px; max-width:520px; margin:auto; }

h2 { font-size:28px; margin-bottom:8px; letter-spacing:0.5px; }

input, select {
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  color:white;
  outline:none;
}

button {
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:12px;
  border:none;
  background: linear-gradient(90deg, #6366f1, #8b5cf6);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}

button:hover { transform: scale(1.02); }

.card {
  margin-top:18px;
  background: rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  padding:16px;
  border-radius:16px;
  backdrop-filter: blur(12px);
}

.badge {
  display:inline-block;
  margin:6px 6px 0 0;
  padding:8px 12px;
  border-radius:999px;
  background: rgba(99,102,241,0.15);
  border:1px solid rgba(99,102,241,0.3);
  font-size:13px;
}

.small { font-size:12px; opacity:0.6; margin-top:6px; }

hr {
  border:0;
  border-top:1px solid rgba(255,255,255,0.1);
  margin:12px 0;
}
</style>
</head>

<body>

<div class="container">

<h2>CounterForge PRO</h2>
<div class="small">LIVE draft intelligence system</div>

<input id="search" placeholder="Search champion..." oninput="filter()">

<!-- 🔥 LANE SELECT ADDED -->
<select id="lane">
  <option value="top">Top</option>
  <option value="jungle">Jungle</option>
  <option value="mid">Mid</option>
  <option value="adc">ADC</option>
  <option value="support">Support</option>
</select>

<select id="champ"></select>

<button onclick="analyze()">Analyze Draft</button>

<div id="out"></div>

</div>

<script>

let champs = [];

/* =========================
   🔥 LATEST PATCH LOAD
========================= */
fetch("https://ddragon.leagueoflegends.com/api/versions.json")
.then(r => r.json())
.then(versions => {

  const latest = versions[0];

  return fetch(`https://ddragon.leagueoflegends.com/cdn/${latest}/data/en_US/champion.json`);
})
.then(r => r.json())
.then(data => {

  champs = Object.keys(data.data).sort();

  document.getElementById("champ").innerHTML =
    champs.map(c => `<option>${c}</option>`).join("");
});


/* =========================
   ENGINE (LANE AWARE)
========================= */

function scoreCounter(enemy, pick, lane){

  const antiAssassin = ["Lissandra","Malzahar","Annie","Galio"];
  const antiTank = ["Vayne","Fiora","Trundle","Kayn"];
  const antiBruiser = ["Quinn","Gnar","Teemo","Vayne"];

  let score = 6.5;

  const isTank = ["Ornn","Sion","Malphite","Shen","Zac"].includes(enemy);
  const isAssassin = ["Zed","Talon","Katarina","Akali","Yone"].includes(enemy);
  const isBruiser = ["Jax","Darius","Irelia","Fiora","Aatrox"].includes(enemy);

  /* CORE MATCHUPS */
  if (isAssassin && antiAssassin.includes(pick)) score += 2.0;
  if (isTank && antiTank.includes(pick)) score += 1.8;
  if (isBruiser && antiBruiser.includes(pick)) score += 1.8;

  /* SPECIFIC BOOSTS */
  if (enemy === "Zed" && pick === "Lissandra") score += 1.5;
  if (enemy === "Jax" && pick === "Poppy") score += 1.5;

  /* 🔥 LANE LOGIC */
  if (lane === "mid" && pick === "Lissandra") score += 1.2;
  if (lane === "top" && pick === "Quinn") score += 1.0;
  if (lane === "jungle" && pick === "Kayn") score += 1.0;
  if (lane === "adc" && pick === "Vayne") score += 1.0;
  if (lane === "support" && pick === "Lulu") score += 1.0;

  return Math.min(10, Number(score.toFixed(1)));
}


/* =========================
   COUNTER ENGINE
========================= */

function getCounters(enemy, lane){

  const pool = [
    "Malphite","Poppy","Gragas","Lissandra","Annie",
    "Sett","Garen","Shen","Ornn","Teemo",
    "Vayne","Quinn","Fiora","Trundle","Gnar",
    "Galio","Kayn","Mordekaiser"
  ];

  return pool
    .map(p => ({
      name: p,
      score: scoreCounter(enemy, p, lane)
    }))
    .sort((a,b) => b.score - a.score)
    .slice(0,5);
}


/* =========================
   ANALYZE
========================= */

function analyze(){

  let enemy = document.getElementById("champ").value;
  let lane = document.getElementById("lane").value;

  let counters = getCounters(enemy, lane);

  let ban =
    enemy === "Zed" ? "Ban Zed (high snowball assassin)" :
    enemy === "Yasuo" ? "Ban Yasuo (soloQ carry)" :
    enemy === "Irelia" ? "Ban Irelia (lane bully)" :
    "Ban high mobility assassin";

  document.getElementById("out").innerHTML = `
    <div class="card">
      <h3>VS ${enemy} (${lane})</h3>
      <div class="small">LIVE patch AI draft analysis</div>

      <hr>

      <b>BEST COUNTERS</b><br>
      ${counters.map(c => `
        <div class="badge">${c.name} • ${c.score}/10</div>
      `).join("")}

      <hr>

      <b>BAN RECOMMENDATION</b><br>
      <div class="badge">${ban}</div>

      <hr>

      <div class="small">
        • adapt lane pressure<br>
        • play for tempo windows<br>
        • punish cooldowns
      </div>
    </div>
  `;
}


/* =========================
   SEARCH
========================= */

function filter(){
  let v = document.getElementById("search").value.toLowerCase();

  document.getElementById("champ").innerHTML =
    champs
      .filter(c => c.toLowerCase().includes(v))
      .map(c => `<option>${c}</option>`)
      .join("");
}

</script>

</body>
</html>

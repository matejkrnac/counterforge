<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CounterForge PRO</title>

<style>
body { margin:0; font-family:Arial; background:#0b0b0b; color:white; }
.container { padding:16px; max-width:520px; margin:auto; }
input, select, button {
  width:100%; padding:12px; margin-top:10px;
  border-radius:10px; border:none; font-size:16px;
}
button { background:#4f46e5; color:white; }
.card { margin-top:15px; background:#1a1a1a; padding:14px; border-radius:12px; }
.badge { display:inline-block; margin:5px; padding:6px 10px; background:#2a2a2a; border-radius:8px; }
.small { font-size:12px; opacity:0.7; }
.row { display:flex; gap:10px; }
</style>
</head>

<body>

<div class="container">

<h2>CounterForge PRO</h2>

<input id="search" placeholder="Search champion..." oninput="filter()">

<select id="champ"></select>

<button onclick="analyze()">Analyze draft</button>

<div id="out"></div>

</div>

<script>

let champs = [];

// LOAD ALL CHAMPS (REAL DATA)
fetch("https://ddragon.leagueoflegends.com/cdn/14.1.1/data/en_US/champion.json")
.then(r => r.json())
.then(data => {
  champs = Object.keys(data.data).sort();
  document.getElementById("champ").innerHTML =
    champs.map(c => `<option>${c}</option>`).join("");
});

// PRO MATCHUP ENGINE (scalable)
function getCounters(champ){

  // simplified scoring system (later: Riot API / dataset)
  const base = [
    {name:"Malphite", score:9.7, type:"tank counter"},
    {name:"Poppy", score:9.5, type:"dash counter"},
    {name:"Gragas", score:9.3, type:"flex pick"},
    {name:"Lissandra", score:9.1, type:"anti-assassin"},
    {name:"Sett", score:8.8, type:"lane bully"},
    {name:"Annie", score:8.6, type:"burst control"}
  ];

  return base.sort((a,b)=>b.score-a.score).slice(0,4);
}

// ANALYZE DRAFT
function analyze(){
  let c = document.getElementById("champ").value;
  let counters = getCounters(c);

  document.getElementById("out").innerHTML = `
    <div class="card">
      <h3>VS ${c}</h3>
      <div class="small">CounterForge PRO analysis engine</div>

      ${counters.map(x=>`
        <div class="badge">${x.name} • ${x.score}/10 (${x.type})</div>
      `).join("")}

      <div class="small" style="margin-top:10px;">
        Tip: focus on lane control + early tempo
      </div>
    </div>
  `;
}

// SEARCH
function filter(){
  let v = document.getElementById("search").value.toLowerCase();
  document.getElementById("champ").innerHTML =
    champs.filter(c=>c.toLowerCase().includes(v))
    .map(c=>`<option>${c}</option>`).join("");
}

</script>

</body>
</html>

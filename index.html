<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CounterForge ULTIMATE</title>

<style>
body { margin:0; font-family:Arial; background:#0a0a0a; color:white; }
.container { padding:16px; max-width:520px; margin:auto; }
input, select, button {
  width:100%; padding:12px; margin-top:10px;
  border-radius:10px; border:none; font-size:16px;
}
button { background:#6366f1; color:white; }
.card { margin-top:15px; background:#151515; padding:14px; border-radius:12px; }
.badge { display:inline-block; margin:5px; padding:6px 10px; background:#2a2a2a; border-radius:8px; }
.small { font-size:12px; opacity:0.7; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
hr { border:0; border-top:1px solid #333; margin:10px 0; }
</style>
</head>

<body>

<div class="container">

<h2>CounterForge ULTIMATE</h2>

<input id="search" placeholder="Search champion..." oninput="filter()">

<select id="champ"></select>

<button onclick="analyze()">Analyze Draft</button>

<div id="out"></div>

</div>

<script>

let champs = [];

// LOAD ALL CHAMPIONS (REAL DATA)
fetch("https://ddragon.leagueoflegends.com/cdn/14.1.1/data/en_US/champion.json")
.then(r => r.json())
.then(data => {
  champs = Object.keys(data.data).sort();
  document.getElementById("champ").innerHTML =
    champs.map(c=>`<option>${c}</option>`).join("");
});


// =========================
// CORE ENGINE (ULTIMATE)
// =========================

// role assumptions (simplified meta logic)
const roleBias = {
  assassin: ["Zed","Katarina","Fizz","Talon"],
  tank: ["Malphite","Ornn","Sion","Shen"],
  bruiser: ["Jax","Darius","Irelia","Renekton"]
};

// counter logic engine (weighted)
function scoreCounter(enemy, pick){
  let score = 7.0;

  // simple logic rules
  if(["Malphite","Ornn","Sion"].includes(pick)) score += 1.2;
  if(["Lissandra","Annie","Malzahar"].includes(pick) && enemy==="Zed") score += 1.5;
  if(["Poppy","Gragas"].includes(pick)) score += 1.3;
  if(["Vayne","Quinn"].includes(pick) && enemy==="Jax") score += 1.4;

  // generic scaling penalty
  if(["Yasuo","Irelia","Fiora"].includes(enemy) && pick==="Teemo") score -= 0.5;

  return Math.min(10, score.toFixed(1));
}

// COUNTER POOL ENGINE
function getCounters(enemy){

  const pool = [
    "Malphite","Poppy","Gragas","Lissandra","Annie",
    "Sett","Garen","Teemo","Vayne","Quinn","Shen","Ornn"
  ];

  return pool.map(p => ({
    name:p,
    score:scoreCounter(enemy,p)
  }))
  .sort((a,b)=>b.score-a.score)
  .slice(0,5);
}

// DRAFT ANALYZER (TEAM LOGIC)
function analyze(){
  let enemy = document.getElementById("champ").value;

  let counters = getCounters(enemy);

  let banSuggestion =
    enemy==="Yasuo" ? "Ban: Yasuo (high snowball risk)" :
    enemy==="Zed" ? "Ban: Zed (soloQ carry threat)" :
    "Ban: high mobility assassin";

  document.getElementById("out").innerHTML = `
    <div class="card">
      <h3>VS ${enemy}</h3>
      <div class="small">ULTIMATE draft engine (weighted scoring)</div>

      <hr>

      <b>BEST COUNTERS</b><br>
      ${counters.map(c=>`
        <div class="badge">${c.name} • ${c.score}/10</div>
      `).join("")}

      <hr>

      <b>BAN RECOMMENDATION</b><br>
      <div class="badge">${banSuggestion}</div>

      <hr>

      <b>STRATEGY</b>
      <div class="small">
        • play for early tempo<br>
        • deny mobility windows<br>
        • force objective fights mid game
      </div>
    </div>
  `;
}

// SEARCH ENGINE
function filter(){
  let v = document.getElementById("search").value.toLowerCase();

  document.getElementById("champ").innerHTML =
    champs.filter(c=>c.toLowerCase().includes(v))
    .map(c=>`<option>${c}</option>`).join("");
}

</script>

</body>
</html>

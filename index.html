<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CounterForge PRO</title>

<style>
body { margin:0; font-family: Arial; background:#0a0a0a; color:white; }
.container { padding:18px; max-width:520px; margin:auto; }
input, select, button {
  width:100%; padding:12px; margin-top:10px;
  border-radius:10px; border:none; font-size:16px;
}
button { background:#6366f1; color:white; }
.card { margin-top:15px; background:#1a1a1a; padding:14px; border-radius:12px; }
.badge { display:inline-block; margin:5px; padding:6px 10px; background:#2a2a2a; border-radius:8px; }
.small { font-size:12px; opacity:0.7; }
</style>
</head>

<body>

<div class="container">

<h2>CounterForge PRO</h2>

<input id="search" placeholder="Search champion..." oninput="filter()">

<select id="champ"></select>

<button onclick="analyze()">Analyze matchup</button>

<div id="out"></div>

</div>

<script>

let champions = [];

// PRO DATA ENGINE (placeholder + scalable model)
let matchData = {};

// load ALL champions dynamically
fetch("https://ddragon.leagueoflegends.com/cdn/14.1.1/data/en_US/champion.json")
.then(r => r.json())
.then(data => {
  champions = Object.keys(data.data).sort();
  let sel = document.getElementById("champ");

  sel.innerHTML = champions.map(c => `<option>${c}</option>`).join("");
});

// simple scoring engine (expandable to ML later)
function getCounters(champ){
  // pseudo-pro logic (weights based system)
  const pool = [
    {name:"Malphite", score:9.6},
    {name:"Poppy", score:9.4},
    {name:"Gragas", score:9.2},
    {name:"Sett", score:8.9},
    {name:"Lissandra", score:8.8},
    {name:"Annie", score:8.6}
  ];

  // shuffle-ish variation (simulates matchup diff)
  return pool
    .sort((a,b)=> b.score - a.score)
    .slice(0,3);
}

function analyze(){
  let c = document.getElementById("champ").value;
  let counters = getCounters(c);

  document.getElementById("out").innerHTML = `
    <div class="card">
      <h3>VS ${c}</h3>
      <div class="small">PRO draft engine analysis</div>
      ${counters.map(x => `
        <div class="badge">${x.name} • ${x.score}/10</div>
      `).join("")}
    </div>
  `;
}

function filter(){
  let v = document.getElementById("search").value.toLowerCase();
  let sel = document.getElementById("champ");

  sel.innerHTML = champions
    .filter(c => c.toLowerCase().includes(v))
    .map(c => `<option>${c}</option>`)
    .join("");
}

</script>

</body>
</html>
